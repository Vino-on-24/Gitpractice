<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Git & GitHub Complete Guide</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {

}
.header {

}
.header h1 {
  font-size: 3rem;
  font-weight: 800;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header .subtitle {
  font-size: 1.2rem;
  color: #c0c0d0;
  margin-bottom: 8px;
}
.header .stats {
  font-size: 0.95rem;
  color: #8080a0;
  margin-top: 12px;
}
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 30px 20px;
}
.category {
  background: rgba(30,30,50,0.6);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 30px;
  border: 1px solid rgba(99,102,241,0.2);

}
.category-title {
  font-size: 1.6rem;

  align-items: center;
  gap: 12px;
}
.topics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px;
}
.topic-card {
  background: rgba(40,40,70,0.8);
  border-radius: 12px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.3s ease;
  border-left: 4px solid #6366f1;
  position: relative;
  overflow: hidden;
}
.topic-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(168,85,247,0.1));
  opacity: 0;
  transition: opacity 0.3s;
}
.topic-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 40px rgba(99,102,241,0.4);
  border-left-color: #a855f7;
}
.topic-card:hover::before { opacity: 1; }
.topic-card h3 {
  font-size: 1.2rem;
  color: #fff;
  margin-bottom: 6px;
  font-weight: 600;
  position: relative;
  z-index: 1;
}
.topic-card .cat-label {
  font-size: 0.8rem;
  color: #a0a0c0;
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
}
.topic-card p {
  color: #c0c0d0;
  font-size: 0.9rem;
  line-height: 1.5;
  position: relative;
  z-index: 1;
}
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(5px);
  z-index: 1000;
  overflow-y: auto;
  padding: 20px;
}
.modal-dialog {
  max-width: 1100px;
  margin: 40px auto;
  background: #1a1a2e;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  border: 2px solid rgba(99,102,241,0.3);
}
.modal-header {
  background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
  padding: 25px 30px;
  position: relative;
}
.modal-header h2 {
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 6px;
  padding-right: 50px;
}
.modal-header .desc {
  color: rgba(255,255,255,0.95);
  font-size: 0.95rem;
  line-height: 1.5;
}
.close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  border: none;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}
.close-btn:hover {
  background: rgba(255,255,255,0.3);
  transform: rotate(90deg);
}
.modal-body {
  padding: 35px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
}
.section {
  margin-bottom: 30px;
}
.section-title {
  font-size: 1.3rem;
  color: #a855f7;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
}
.keypoint {
  background: rgba(99,102,241,0.1);
  border-left: 4px solid #6366f1;
  padding: 14px 18px;
  margin-bottom: 10px;
  border-radius: 8px;
  display: flex;
  gap: 12px;
  align-items: start;
  transition: all 0.2s;
}
.keypoint:hover {
  background: rgba(99,102,241,0.15);
  transform: translateX(5px);
}
.keypoint::before {
  content: '▸';
  color: #a855f7;
  font-size: 1.1rem;
  font-weight: bold;
  flex-shrink: 0;
  margin-top: 2px;
}
.keypoint-text {
  color: #e0e0f0;
  line-height: 1.6;
  font-size: 0.95rem;
}
.command-block {
  background: rgba(15,23,42,0.8);
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 10px;
  transition: all 0.2s;
}
.command-block:hover {
  border-color: #6366f1;
  box-shadow: 0 4px 12px rgba(99,102,241,0.2);
}
.command-block code {
  color: #4ade80;
  font-family: 'Courier New', Consolas, Monaco, monospace;
  font-size: 0.9rem;
  display: block;
  margin-bottom: 6px;
  font-weight: 500;
}
.command-block .desc {
  color: #a0a0c0;
  font-size: 0.85rem;
  line-height: 1.5;
}
.example-block {
  background: rgba(15,23,42,0.6);
  border: 1px solid rgba(168,85,247,0.3);
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
}
.example-block h4 {
  color: #c084fc;
  font-size: 1.05rem;
  margin-bottom: 10px;
  font-weight: 600;
}
.example-block pre {
  color: #e0e0f0;
  font-family: 'Courier New', Consolas, Monaco, monospace;
  font-size: 0.85rem;
  line-height: 1.7;
  white-space: pre-wrap;
  word-wrap: break-word;
  background: rgba(0,0,0,0.3);
  padding: 14px;
  border-radius: 8px;
  overflow-x: auto;
}
.interview-section {
  background: linear-gradient(135deg, rgba(234,179,8,0.1), rgba(251,191,36,0.05));
  border-left: 4px solid #eab308;
  padding: 22px;
  border-radius: 12px;
}
.interview-section .section-title {
  color: #fbbf24;
}
.interview-section p {
  color: #f0f0f0;
  line-height: 1.8;
  margin-bottom: 10px;
  font-size: 0.95rem;
}
.interview-section strong {
  color: #fcd34d;
  font-weight: 600;
}
.interview-section b {
  color: #fde047;
}
.footer {
  text-align: center;
  padding: 35px 20px;
  color: #8080a0;
  font-size: 0.9rem;
  border-top: 1px solid rgba(99,102,241,0.2);
  margin-top: 30px;
}
@media(max-width:768px) {
  .header h1 { font-size: 2rem; }
  .topics-grid { grid-template-columns: 1fr; }
  .modal-body { padding: 25px; }
}
</style>
</head>

<script>
const allTopics = [
  {
    category: "Git Basics",
    icon: "🎯",
    topics: [
      {
        name: "Git Introduction",
        desc: "Git is a distributed version control system for tracking code changes. Every developer has full repository history.",
        key: [
          "Distributed VCS - every developer has complete repository history locally",
          "Created by Linus Torvalds in 2005 for Linux kernel development",
          "Tracks changes via snapshots, not file deltas - more efficient storage",
          "Three states: Working Directory, Staging Area (Index), Repository (.git)",
          "Works completely offline - commit, branch, merge without internet connection"
        ],
        cmd: [
          ["git --version", "Check installed Git version"],
          ["git config --global user.name 'Your Name'", "Set your username globally"],
          ["git config --global user.email 'your@email.com'", "Set your email globally"],
          ["git config --list", "View all Git configurations"],
          ["git help <command>", "Get help for any Git command"]
        ],
        ex: [
          { title: "Initial Git Setup", code: "# Configure Git for first time\ngit config --global user.name \"Rajkumar\"\ngit config --global user.email \"raj@finspot.com\"\ngit config --global core.editor \"vim\"\ngit config --global init.defaultBranch main\n\n# Verify configuration\ngit config --list" },
          { title: "Understanding Git States", code: "# Three main areas:\n# 1. Working Directory - where you edit files\n# 2. Staging Area (Index) - prepared for commit\n# 3. Repository (.git) - permanent storage\n\n# File lifecycle:\n# Untracked → Staged → Committed → Modified" }
        ],
        int: "<p><b>Q: What is Git and how does it differ from GitHub?</b><br><strong>A:</strong> Git is a distributed version control system that runs locally to track code changes. GitHub is a cloud-based hosting service for Git repositories with collaboration features like pull requests, issues, and CI/CD.</p><p><b>Q: Explain the three states in Git</b><br><strong>A:</strong> 1) <strong>Working Directory:</strong> Where you modify files<br>2) <strong>Staging Area:</strong> Where you prepare commits with 'git add'<br>3) <strong>Repository:</strong> Where Git permanently stores snapshots</p>"
      },
      {
        name: "Repository Init & Clone",
        desc: "Initialize new Git repositories or clone existing ones. Creates .git directory containing all version control data.",
        key: [
          "git init creates a new repository in the current directory",
          "git clone copies an existing repository with complete history",
          "Can clone via HTTPS (requires credentials) or SSH (key-based)",
          "Shallow clones (--depth) save bandwidth by limiting history depth",
          ".git directory contains all version control data - never delete it"
        ],
        cmd: [
          ["git init", "Initialize new Git repository"],
          ["git clone <url>", "Clone remote repository"],
          ["git clone --depth 1 <url>", "Shallow clone (latest commit only)"],
          ["gh repo create", "Create GitHub repo (CLI)"]
        ],
        ex: [
          { title: "Initialize New Project", code: "mkdir devops-project\ncd devops-project\ngit init\necho \"# DevOps Project\" > README.md\ngit add .\ngit commit -m \"Initial commit\"" },
          { title: "Clone Repository", code: "# Clone via SSH (recommended)\ngit clone git@github.com:user/repo.git\n\n# Clone via HTTPS\ngit clone https://github.com/user/repo.git\n\n# Shallow clone for CI/CD\ngit clone --depth 1 https://github.com/kubernetes/kubernetes.git" }
        ],
        int: "<p><b>Q: What happens when you run 'git init'?</b><br><strong>A:</strong> Git creates a .git directory containing: objects/ (commits, files), refs/ (branches, tags), HEAD (current branch pointer), config (settings), hooks/ (automation scripts).</p><p><b>Q: When use shallow clone?</b><br><strong>A:</strong> In CI/CD pipelines where you only need latest code to build/test, not full history. Saves time and disk space. Example: Docker builds in Jenkins.</p>"
      },
      {
        name: "Status & Diffs",
        desc: "Monitor working directory state and view changes. Essential for understanding current state before commits.",
        key: [
          "git status shows current branch, modified files, and staging state",
          "git diff shows line-by-line changes in working directory",
          "git log displays commit history with author, date, and message",
          "Red files in status = modified, Green = staged and ready to commit",
          "Always check status and diff before committing to verify changes"
        ],
        cmd: [
          ["git status", "Show working directory status"],
          ["git diff", "Show unstaged changes"],
          ["git diff --staged", "Show staged changes"],
          ["git log --oneline", "Compact commit history"],
          ["git log --graph --all", "Visual branch graph"]
        ],
        ex: [
          { title: "Check Status", code: "git status\n# Red files: Modified but not staged\n# Green files: Staged and ready\n# Untracked: New files\n\ngit diff app.js  # See exact changes\ngit diff --staged  # See what will be committed" },
          { title: "View History", code: "# Compact log\ngit log --oneline -10\n\n# Beautiful graph\ngit log --graph --oneline --all\n\n# Search commits\ngit log --grep=\"fix\" --author=\"Rajkumar\"" }
        ],
        int: "<p><b>Q: 'git diff' vs 'git diff --staged'?</b><br><strong>A:</strong> 'git diff' shows unstaged changes (working dir vs staging). 'git diff --staged' shows staged changes (staging vs last commit). Helps review before committing.</p>"
      }
    ]
  },
  {
    category: "Working with Changes",
    icon: "✏️",
    topics: [
      {
        name: "Add & Commit",
        desc: "Stage files and create commits - permanent snapshots with descriptive messages describing what changed and why.",
        key: [
          "git add moves files from working directory to staging area",
          "Staging area lets you craft precise, atomic commits",
          "git commit creates permanent snapshot with unique SHA-1 hash",
          "Commit messages should be clear: what changed and why",
          "Atomic commits: each commit represents one logical change"
        ],
        cmd: [
          ["git add <file>", "Stage specific file"],
          ["git add .", "Stage all changes in current directory"],
          ["git add -p", "Interactive staging (choose hunks)"],
          ["git commit -m 'message'", "Commit with inline message"],
          ["git commit --amend", "Modify last commit"]
        ],
        ex: [
          { title: "Basic Workflow", code: "# Stage files\ngit add src/app.js config/db.yml\n\n# Commit\ngit commit -m \"feat: Add user authentication\"\n\n# Stage all and commit\ngit commit -am \"fix: Database timeout\"" },
          { title: "Good Commit Messages", code: "# Conventional commits format:\nfeat(api): Add user authentication endpoint\nfix(k8s): Increase deployment timeout\ndocs(readme): Update installation steps" }
        ],
        int: "<p><b>Q: Why have staging area?</b><br><strong>A:</strong> Allows crafting precise commits. You might have bug fix + new feature mixed. Stage bug fix first (commit), then stage feature (commit). Makes history clearer and reverting easier.</p><p><b>Q: When use 'git commit --amend'?</b><br><strong>A:</strong> Only for unpushed commits! Use to add forgotten files or fix message typos. Never amend public commits - rewrites history.</p>"
      },
      {
        name: "Ignoring Files",
        desc: "Specify files and patterns for Git to ignore. Essential for excluding secrets, build artifacts, dependencies.",
        key: [
          ".gitignore file specifies patterns for files Git should ignore",
          "Prevents accidentally committing sensitive data or temporary files",
          "Patterns apply to all subdirectories unless path is specified",
          "Can have multiple .gitignore files at different directory levels",
          "Global .gitignore for personal preferences (IDE settings, OS files)"
        ],
        cmd: [
          ["touch .gitignore", "Create .gitignore file"],
          ["git rm --cached <file>", "Remove file from Git but keep locally"],
          ["git clean -fd", "Remove untracked files"],
          ["git check-ignore -v <file>", "Debug why file is ignored"]
        ],
        ex: [
          { title: "DevOps .gitignore", code: "# Secrets\n.env\n*.pem\n*.key\nsecrets.yaml\n\n# Dependencies\nnode_modules/\nvenv/\n\n# Build\ndist/\n*.log\n.terraform/\n\n# IDE\n.vscode/\n.idea/" },
          { title: "Remove Already Committed", code: "# Accidentally committed node_modules\necho \"node_modules/\" >> .gitignore\ngit rm -r --cached node_modules/\ngit commit -m \"chore: Remove node_modules\"\n\n# CRITICAL: Rotate secrets if committed!" }
        ],
        int: "<p><b>Q: Accidentally committed secrets?</b><br><strong>A:</strong> 1) Add to .gitignore, 2) git rm --cached secrets.env, 3) Commit removal, 4) ROTATE THE SECRETS! (they're in history), 5) Use BFG Repo-Cleaner to purge history, 6) Force push (dangerous). Prevention: Use pre-commit hooks.</p>"
      }
    ]
  },
  {
    category: "Branching & Merging",
    icon: "🌿",
    topics: [
      {
        name: "Branches",
        desc: "Branches are lightweight pointers to commits enabling parallel development without affecting main code.",
        key: [
          "Branches allow parallel development without affecting main code",
          "Branch is just a movable pointer to a commit - very lightweight (40 bytes)",
          "HEAD points to current branch; detached HEAD points to specific commit",
          "Creating branch doesn't copy files - just creates new pointer",
          "Common branches: main/master, develop, feature/*, bugfix/*, hotfix/*"
        ],
        cmd: [
          ["git branch", "List all local branches"],
          ["git checkout -b <name>", "Create and switch to new branch"],
          ["git branch -d <name>", "Delete branch (safe)"],
          ["git switch <branch>", "Switch branch (newer syntax)"]
        ],
        ex: [
          { title: "Basic Operations", code: "# Create and switch\ngit checkout -b feature/auth\n\n# Work and commit\ngit commit -am \"Add authentication\"\n\n# Switch back\ngit checkout main\ngit merge feature/auth\ngit branch -d feature/auth" },
          { title: "Branch Naming", code: "# Features\nfeature/add-redis-cache\n\n# Bug fixes\nbugfix/memory-leak\n\n# Hotfixes\nhotfix/security-patch\n\n# With tickets\nJIRA-123-implement-auth" }
        ],
        int: "<p><b>Q: What is HEAD?</b><br><strong>A:</strong> HEAD is pointer to current branch, which points to last commit. When you commit, branch moves forward. Detached HEAD = HEAD points directly to commit, not branch.</p><p><b>Q: Branch strategies?</b><br><strong>A:</strong> Git Flow: main, develop, feature/*, hotfix/* - for scheduled releases. GitHub Flow: main + features - simpler, continuous deployment. Trunk-Based: main + short features - best for CI/CD.</p>"
      },
      {
        name: "Merging",
        desc: "Combine changes from branches. Fast-forward moves pointer, three-way creates merge commit.",
        key: [
          "git merge combines changes from one branch into current branch",
          "Fast-forward merge: linear history, just moves pointer forward",
          "Three-way merge: creates new merge commit with two parents",
          "Conflicts happen when same lines modified in both branches",
          "Always checkout target branch first, then merge source branch"
        ],
        cmd: [
          ["git merge <branch>", "Merge branch into current"],
          ["git merge --no-ff <branch>", "Force merge commit"],
          ["git merge --abort", "Abort merge"],
          ["git diff --name-only --diff-filter=U", "List conflicts"]
        ],
        ex: [
          { title: "Basic Merge", code: "# Merge feature into develop\ngit checkout develop\ngit pull origin develop\ngit merge feature/new-api\ngit push origin develop\n\n# Delete feature branch\ngit branch -d feature/new-api" },
          { title: "Resolve Conflicts", code: "git merge feature/update\n# CONFLICT in config.yml\n\n# Open file, see markers:\n# <<<<<<< HEAD\n# database: postgresql\n# =======\n# database: mysql\n# >>>>>>> feature\n\n# Fix, remove markers\ngit add config.yml\ngit commit" }
        ],
        int: "<p><b>Q: Fast-forward vs three-way?</b><br><strong>A:</strong> Fast-forward: Target unchanged since branch, just move pointer. Linear history, no merge commit. Three-way: Both have new commits, creates merge commit with two parents. Shows where branches merged.</p><p><b>Q: Resolve conflicts?</b><br><strong>A:</strong> 1) git status (see conflicts), 2) Open files (look for <<< === >>>), 3) Choose/combine code, 4) Remove markers, 5) Test, 6) git add filename, 7) git commit.</p>"
      },
      {
        name: "Rebasing",
        desc: "Rebase replays commits on new base for linear history. Interactive rebase allows editing commits.",
        key: [
          "Rebase moves/replays commits to new base",
          "Creates cleaner, linear history compared to merge commits",
          "Interactive rebase (-i) allows editing commit history",
          "Golden rule: Never rebase public/shared branches",
          "Use for private feature branches before merging to main"
        ],
        cmd: [
          ["git rebase <branch>", "Rebase onto branch"],
          ["git rebase -i HEAD~3", "Interactive rebase last 3 commits"],
          ["git rebase --continue", "Continue after conflict"],
          ["git pull --rebase", "Pull with rebase"]
        ],
        ex: [
          { title: "Basic Rebase", code: "# Update feature with latest main\ngit checkout feature\ngit rebase main\n\n# Fix conflicts if any\ngit add resolved-file.js\ngit rebase --continue\n\n# Force push (history changed)\ngit push --force-with-lease" },
          { title: "Interactive Rebase", code: "# Clean last 5 commits before PR\ngit rebase -i HEAD~5\n\n# Editor opens:\npick a1b2 Add feature\nsquash b2c3 WIP\nsquash c3d4 Fix typo\n\n# Commands:\n# pick - keep\n# squash - combine\n# drop - remove" }
        ],
        int: "<p><b>Q: Merge vs rebase?</b><br><strong>A:</strong> Merge: Preserves history, creates merge commits, non-destructive. Rebase: Linear history, no merge commits, rewrites history. Use merge for shared branches, rebase for private features.</p><p><b>Q: Golden rule?</b><br><strong>A:</strong> NEVER rebase public/shared branches! Only rebase local commits. Rebasing rewrites history - chaos if others have those commits.</p>"
      }
    ]
  },
  {
    category: "Remote Operations",
    icon: "☁️",
    topics: [
      {
        name: "Remote Repositories",
        desc: "Remote repositories are versions of your project hosted on network. Enable team collaboration.",
        key: [
          "Origin is the default name for primary remote repository",
          "Can have multiple remotes (origin, upstream, etc.)",
          "Remote branches track branches on the remote server",
          "Fetch downloads changes without merging, pull does both",
          "Common platforms: GitHub, GitLab, Bitbucket, Azure DevOps"
        ],
        cmd: [
          ["git remote -v", "List remotes with URLs"],
          ["git remote add <name> <url>", "Add new remote"],
          ["git remote set-url <name> <url>", "Change remote URL"],
          ["git fetch origin", "Download changes"]
        ],
        ex: [
          { title: "Setup Remote", code: "# Add remote\ngit remote add origin git@github.com:user/repo.git\n\n# Push\ngit push -u origin main\n\n# Verify\ngit remote -v" },

function renderTopics() {
  const container = document.getElementById('content');
  
  allTopics.forEach(cat => {
    const categoryDiv = document.createElement('div');
    categoryDiv.className = 'category';
    
    let html = `<div class="category-title">
      <span>${cat.icon}</span>
      <span>${cat.category}</span>
    </div>
    <div class="topics-grid">`;
    
    cat.topics.forEach(topic => {
      const topicData = JSON.stringify(topic).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
      html += `
        <div class="topic-card" onclick='openModal(${topicData})'>
          <h3>${topic.name}</h3>
          <p class="cat-label">${cat.category}</p>
          <p>${topic.desc}</p>
        </div>`;
    });
    
    html += '</div>';
    categoryDiv.innerHTML = html;
    container.appendChild(categoryDiv);
  });
}

function openModal(topic) {
  const modal = document.getElementById('modal');
  const headerContent = document.getElementById('modal-header-content');
  const bodyContent = document.getElementById('modal-body-content');
  
  headerContent.innerHTML = `
    <h2>${topic.name}</h2>
    <div class="desc">${topic.desc}</div>
  `;
  
  let bodyHTML = `
    <div class="section">
      <div class="section-title">🔑 Key Points</div>
      ${topic.key.map(k => `<div class="keypoint"><span class="keypoint-text">${k}</span></div>`).join('')}
    </div>
    
    <div class="section">
      <div class="section-title">💻 Essential Commands</div>
      ${topic.cmd.map(c => `
        <div class="command-block">
          <code>${c[0]}</code>
          <div class="desc">${c[1]}</div>
        </div>
      `).join('')}
    </div>
    
    <div class="section">
      <div class="section-title">🎯 Practical Examples</div>
      ${topic.ex.map(ex => `
        <div class="example-block">
          <h4>${ex.title}</h4>
          <pre>${ex.code}</pre>
        </div>
      `).join('')}
    </div>
    
    <div class="interview-section">
      <div class="section-title">💡 Interview Questions & Answers</div>
      ${topic.int}
    </div>
  `;
  
  bodyContent.innerHTML = bodyHTML;
  modal.style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  document.body.style.overflow = 'auto';
}

window.onload = () => {
  try {
    renderTopics();
    console.log('✅ Git & GitHub Guide loaded successfully!');
  } catch (error) {
    console.error('❌ Error:', error);
  }
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
